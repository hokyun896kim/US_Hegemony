name: Update KR Hegemony Data

on:
  schedule:
    - cron: '0 21 * * 6'    # 토 21:00 UTC = 한국 일요일 06:00
  workflow_dispatch:
    inputs:
      limit:
        description: '수집할 최대 종목 수'
        default: '300'
      commit:
        description: '결과를 커밋할지 여부'
        type: boolean
        default: true
      probe:
        description: '데이터 소스 응답 구조만 확인하고 끝낼 종목코드 (예: 005930). 비우면 평소대로 빌드'
        default: ''
  push:
    # 개발 브랜치에서 빌더를 고치면 커밋 없이 소규모 스모크 빌드로 검증만 한다
    branches: ['claude/**']
    paths:
      - 'build_tree_kr.py'
      - 'dart.py'
      - 'naver.py'
      - 'index.html'
      - '.github/workflows/update_kr.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 실측: 미국 장 밖에서는 51~66분, 미국 장중(13:30~20:00 UTC)에는 야후가
    # 스로틀링을 세게 걸어 90분·135분 한도가 연달아 잘렸다(2026-08-08 두 번,
    # 합쳐서 3시간 45분어치 빌드가 버려짐). 주간 크론(토 21:00 UTC)이 한 번도
    # 안 걸린 이유가 이 시간대 회피였다. 장중 실측 페이스(평시의 ~2.2배)에
    # 여유를 얹어 잡는다 — 수동 재실행이 장중에 걸려도 살아남게.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet yfinance

      - name: Logic self-test (네트워크 불필요)
        run: |
          python build_tree_kr.py --selftest
          python dart.py --selftest
          python naver.py --selftest

      # 두 소스의 파싱은 '응답이 내가 가정한 모양인가' 에 통째로 기대고 있는데,
      # 이 코드를 쓴 환경에서는 DART·네이버 어느 쪽에도 네트워크가 닿지 않아
      # 눈으로 못 봤다. 실제로 DART 에서 그 가정이 틀려 '기간이 다른 두 컬럼을
      # 빼서 매출이 음수인 분기'를 만든 적이 있다. 그래서 믿기 전에 여기서
      # 한 번 찍어본다. 빌드는 하지 않는다.
      - name: 데이터 소스 응답 구조 확인
        if: inputs.probe != ''
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          CODE: ${{ inputs.probe }}
        run: |
          {
            echo "## 데이터 소스 응답 구조 확인 · 종목 $CODE"
            echo
            echo '### DART (확정 실적)'
            echo '```'
            if [ -z "${DART_KEY:-}" ]; then
              echo "DART_KEY 저장소 Secret 이 없습니다 — 건너뜁니다."
              echo "Settings → Secrets and variables → Actions 에서 추가하세요."
            else
              python dart.py --probe "$CODE" 2>&1 || echo "(프로브 실패)"
            fi
            echo '```'
            echo
            echo '### 네이버 (잠정 포함)'
            echo '```'
            python naver.py --probe "$CODE" 2>&1 || echo "(프로브 실패)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide run mode
        id: mode
        env:
          # 커밋 메시지는 신뢰할 수 없는 입력이라 셸에 직접 보간하지 않는다
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "limit=${{ github.event.inputs.limit || 300 }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.inputs.commit != 'false' }}" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MSG" | grep -qF '[build-data]'; then
            echo "limit=300"  >> "$GITHUB_OUTPUT"
            echo "commit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::[build-data] 감지 — 전체 빌드 후 데이터를 커밋합니다"
          else
            echo "limit=40"     >> "$GITHUB_OUTPUT"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::개발 브랜치 스모크 빌드 — 40종목만 받고 커밋하지 않습니다"
          fi

      - name: Build data
        if: inputs.probe == ''
        env:
          # 분기 재무를 DART 에서 받는다 — yfinance 보다 1~3주 빠르다.
          # 키가 없으면 빌더가 조용히 yfinance 로 떨어지므로 없어도 돈다.
          DART_KEY: ${{ secrets.DART_KEY }}
        run: python build_tree_kr.py --limit ${{ steps.mode.outputs.limit }}

      - name: Summarize
        if: inputs.probe == ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('data/tree_kr.json', encoding='utf-8'))
          mem = [m for s in d['subs'] for m in s['members']]
          def cnt(k): return sum(1 for m in mem if m.get(k) is not None)
          print(f"## KR 헤게모니 데이터 · {d['updated']}\n")
          print(f"- 종목 **{len(mem)}** · 세부산업 **{len(d['subs'])}** · 대섹터 **{len(d['sectors'])}**")
          print(f"- 분기 TTM 확보 **{cnt('q_spread')}/{len(mem)}** · 상대강도 **{cnt('rs6')}/{len(mem)}** "
                f"· PER **{cnt('pe')}/{len(mem)}**")
          # 분류가 무너지면 트리가 한 덩어리가 되므로 눈에 띄게 남긴다
          unk = sum(s['n'] for s in d['subs'] if s['gics'] == 'Unknown')
          if len(d['subs']) < 3 or unk > len(mem) * 0.3:
              print(f"- ⚠️ **분류 이상**: 세부산업 {len(d['subs'])}개 · 미분류 {unk}종목")
          print(f"- 시장: {d['market']}\n")
          print("### 헤게모니 상위 세부산업")
          print("| 세부산업 | 중앙 스프레드 | 종목수 |")
          print("|---|---:|---:|")
          for s in d['subs'][:10]:
              print(f"| {s['ko']} | {s['med']:+.1f}p | {s['n']} |")
          print("\n### 스프레드 상위 종목")
          print("| 종목 | 연간 | 분기TTM | 가속 | RS6M |")
          print("|---|---:|---:|---:|---:|")
          f = lambda v, u='p': '—' if v is None else f"{v:+.1f}{u}"
          for m in sorted(mem, key=lambda x: -x['spread'])[:10]:
              print(f"| {m['tk']} {m['nm']} | {m['spread']:+.1f}p | "
                    f"{f(m['q_spread'])} | {f(m['accel'])} | {f(m['rs6'], '%')} |")
          PY

      - name: Upload artifact
        if: inputs.probe == ''
        uses: actions/upload-artifact@v4
        with:
          name: tree_kr-${{ github.run_number }}
          path: data/tree_kr.json

      - name: Commit
        if: steps.mode.outputs.commit == 'true' && inputs.probe == ''
        run: |
          git config user.name  "hegemony-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tree_kr.json
          # DART 고유번호 캐시도 남긴다 — 매 회차 다시 받을 이유가 없다.
          [ -f data/dart_corp.json ] && git add data/dart_corp.json || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "auto(kr): update $(date +%Y-%m-%d)"
          # 두 빌더가 같은 브랜치에 민다. 동시에 돌면 뒤늦은 쪽이 거부당하는데,
          # 그때 빌드 결과를 통째로 버리면 안 된다(실측: KR #22 가 데이터를
          # 다 만들고도 push 거부로 실패했다). 남의 커밋 위로 rebase 하고
          # 다시 민다. 우리가 건드리는 건 데이터 파일 하나뿐이라 충돌하지 않는다.
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "::notice::push 거부 — 원격 변경을 받아 rebase 후 재시도 ($i/5)"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || {
              echo "::error::rebase 실패 — 수동 확인 필요"; exit 1; }
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 push 실패"; exit 1
