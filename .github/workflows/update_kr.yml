name: Update KR Hegemony Data

on:
  schedule:
    - cron: '0 21 * * 6'    # 토 21:00 UTC = 한국 일요일 06:00
  workflow_dispatch:
    inputs:
      limit:
        description: '수집할 최대 종목 수'
        default: '300'
      commit:
        description: '결과를 커밋할지 여부'
        type: boolean
        default: true
  push:
    # 개발 브랜치에서 빌더를 고치면 커밋 없이 소규모 스모크 빌드로 검증만 한다
    branches: ['claude/**']
    paths:
      - 'build_tree_kr.py'
      - 'kr.html'
      - '.github/workflows/update_kr.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet yfinance

      - name: Logic self-test (네트워크 불필요)
        run: python build_tree_kr.py --selftest

      - name: Decide run mode
        id: mode
        env:
          # 커밋 메시지는 신뢰할 수 없는 입력이라 셸에 직접 보간하지 않는다
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "limit=${{ github.event.inputs.limit || 300 }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.inputs.commit != 'false' }}" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MSG" | grep -qF '[build-data]'; then
            echo "limit=300"  >> "$GITHUB_OUTPUT"
            echo "commit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::[build-data] 감지 — 전체 빌드 후 데이터를 커밋합니다"
          else
            echo "limit=40"     >> "$GITHUB_OUTPUT"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::개발 브랜치 스모크 빌드 — 40종목만 받고 커밋하지 않습니다"
          fi

      - name: Build data
        run: python build_tree_kr.py --limit ${{ steps.mode.outputs.limit }}

      - name: Summarize
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('data/tree_kr.json', encoding='utf-8'))
          mem = [m for s in d['subs'] for m in s['members']]
          def cnt(k): return sum(1 for m in mem if m.get(k) is not None)
          print(f"## KR 헤게모니 데이터 · {d['updated']}\n")
          print(f"- 종목 **{len(mem)}** · 세부산업 **{len(d['subs'])}** · 대섹터 **{len(d['sectors'])}**")
          print(f"- 분기 TTM 확보 **{cnt('q_spread')}/{len(mem)}** · 상대강도 **{cnt('rs6')}/{len(mem)}** "
                f"· PER **{cnt('pe')}/{len(mem)}**")
          # 분류가 무너지면 트리가 한 덩어리가 되므로 눈에 띄게 남긴다
          unk = sum(s['n'] for s in d['subs'] if s['gics'] == 'Unknown')
          if len(d['subs']) < 3 or unk > len(mem) * 0.3:
              print(f"- ⚠️ **분류 이상**: 세부산업 {len(d['subs'])}개 · 미분류 {unk}종목")
          print(f"- 시장: {d['market']}\n")
          print("### 헤게모니 상위 세부산업")
          print("| 세부산업 | 중앙 스프레드 | 종목수 |")
          print("|---|---:|---:|")
          for s in d['subs'][:10]:
              print(f"| {s['ko']} | {s['med']:+.1f}p | {s['n']} |")
          print("\n### 스프레드 상위 종목")
          print("| 종목 | 연간 | 분기TTM | 가속 | RS6M |")
          print("|---|---:|---:|---:|---:|")
          f = lambda v, u='p': '—' if v is None else f"{v:+.1f}{u}"
          for m in sorted(mem, key=lambda x: -x['spread'])[:10]:
              print(f"| {m['tk']} {m['nm']} | {m['spread']:+.1f}p | "
                    f"{f(m['q_spread'])} | {f(m['accel'])} | {f(m['rs6'], '%')} |")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tree_kr-${{ github.run_number }}
          path: data/tree_kr.json

      - name: Commit
        if: steps.mode.outputs.commit == 'true'
        run: |
          git config user.name  "hegemony-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tree_kr.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "auto(kr): update $(date +%Y-%m-%d)"
          git push origin "HEAD:${{ github.ref_name }}"
