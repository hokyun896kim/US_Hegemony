name: Update Hegemony Data

on:
  schedule:
    - cron: '0 22 * * 6'   # 매주 토요일 22:00 UTC = 한국 일요일 07:00
    # Actions 공용 출구 IP 가 SEC 에 이미 차단돼 있으면 그 회차는 실패한다
    # (다른 크롤러들이 달궈놓은 IP 를 뽑는 복권). 12시간 뒤 백업 슬롯이
    # 새 출구를 뽑아 재시도한다. 성공 회차가 이미 커밋했으면 백업은 무해하다.
    - cron: '0 10 * * 0'   # 일요일 10:00 UTC = 한국 일요일 19:00 (백업)
  workflow_dispatch:
    inputs:
      commit:
        description: '결과를 커밋할지 여부'
        type: boolean
        default: true

# 이게 없어서 2026-05-31 이후 주간 실행 10회가 전부 push 403 으로 죽었다.
# 빌드는 매번 성공했고 커밋까지 만들어 놓고 밀어 넣지를 못했다.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 잡 시작 시각. 아래 야후 갱신이 '한도까지 몇 분 남았는지'를 계산해
      # 예산을 잡는다. 고정값으로 두면 SEC 빌드가 오래 버티다 죽은 회차에
      # 합계가 한도를 넘겨 결과를 통째로 잃는다.
      - run: echo "JOB_T0=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # yfinance 는 컨센서스 추정치(eps_trend)를 받을 때만 쓴다 — 야후
      # quoteSummary 가 crumb 인증을 타는데 그 처리를 대신해준다.
      # 설치가 실패해도 빌더는 추정치만 비우고 계속 돈다.
      - name: Install deps
        run: pip install --quiet yfinance || echo "::warning::yfinance 설치 실패 — 컨센서스 추정치는 비웁니다"

      - name: Build data
        id: build
        # SEC 가 막혀도 회차를 통째로 버리지 않는다 — 아래 단계가 받는다.
        continue-on-error: true
        env:
          # SEC 는 실제 연락처가 담긴 User-Agent 를 요구한다. 저장소 Secret 에
          # SEC_UA 를 넣으면 쓰이고, 없으면 빌더의 기본값으로 동작한다.
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python build_data.py

      # 18회 중 17회가 SEC 403(공유 출구 IP 가 이미 탄 상태)으로 죽었다. 우리
      # 속도 문제가 아니라 대기로도 안 풀린다.
      #
      # 예전에는 이때 '가격층만' 받고 펀더멘털은 그대로 뒀다. 근거는 '펀더멘털은
      # 분기에 한 번 바뀌니 지난주 값과 같다' 였는데, 바로 그 분기가 바뀌면서
      # 전제가 깨졌다 — 실측: 2026-08-08 이후 23일간 한 번도 갱신되지 않았고
      # 그 사이 2분기 실적이 통째로 지나갔다. q_end 가 401종목 전부 비어 있어
      # 화면의 실적미반영·TTM충돌 게이트도 내내 무력했다.
      #
      # 이제는 SEC 가 막혀도 야후로 실적층을 받는다. 1차 자료는 아니므로
      # q_src 에 출처를 남기고 화면이 '야후 가공 수치'라고 밝힌다.
      - name: SEC 가 막혔으면 야후로 갱신
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::전체 빌드 실패 — 시세 전부 + 실적층은 야후로 받습니다(출처 표시됨)"
          # 잡 한도(120분)에서 이미 쓴 시간과 커밋 몫 15분을 뺀 만큼만 예산으로
          # 준다. 빌더가 먼저 끊으면 받은 데까지 저장·커밋하지만, 러너 한도에
          # 먼저 걸리면 결과가 통째로 사라진다.
          LEFT=$(( 120 - ( ($(date -u +%s) - JOB_T0) / 60 ) - 15 ))
          if [ "$LEFT" -lt 10 ]; then
            echo "::error::SEC 빌드가 한도를 거의 다 썼습니다(남은 ${LEFT}분) — 이번 회차는 건너뜁니다"
            exit 1
          fi
          echo "::notice::야후 갱신 예산 ${LEFT}분"
          python refresh_prices.py --deadline "$LEFT"

      - name: Summarize
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('data/tree.json', encoding='utf-8'))
          mem = [m for s in d['subs'] for m in s['members']]
          def cnt(k): return sum(1 for m in mem if m.get(k) is not None)
          print(f"## US 헤게모니 데이터 · {d['updated']}\n")
          if d.get('partial') == 'prices':
              print(f"> ⚠️ **가격층만 갱신**: SEC 가 막혔고 야후 실적층도 한 종목도 못 받았습니다. "
                    f"펀더멘털은 **{d.get('fund_updated')}** 기준 그대로입니다.\n")
          cov = d.get('coverage')
          if cov:
              print(f"> ⚠️ **실적층 일부 갱신**: 이번 회차에 새로 받은 종목 "
                    f"{cov['fresh']}/{cov['total']} · 지난 회차 유지 {cov['carried']}종목 "
                    f"({cov['why']}). 시세는 {cov['total']}종목 전부 최신입니다.\n")
          import collections
          qe = collections.Counter(m.get('q_end') for m in mem)
          print("- 분기말 분포: " + " · ".join(
              f"**{k or '미기록'}** {v}" for k, v in
              sorted(qe.items(), key=lambda x: (x[0] or ''), reverse=True)[:5]))
          src = collections.Counter(m.get('q_src') or 'SEC' for m in mem)
          print(f"- 실적 출처: " + " · ".join(f"**{k}** {v}" for k, v in src.most_common()))
          print(f"- 종목 **{len(mem)}** · 세부산업 **{len(d['subs'])}** · 대섹터 **{len(d['sectors'])}**")
          print(f"- 분기 TTM **{cnt('q_spread')}/{len(mem)}** · 상대강도 **{cnt('rs6')}/{len(mem)}** "
                f"· PER **{cnt('pe')}/{len(mem)}** · 52주고점比 **{cnt('from_high')}/{len(mem)}**")
          mk = d.get('market') or {}
          print(f"- 시장: VIX **{mk.get('vix')}**({mk.get('vix_state')}) · "
                f"SPY 3M **{mk.get('spy3')}%** · 6M **{mk.get('spy6')}%**\n")
          print("### 헤게모니 상위 세부산업")
          print("| 세부산업 | 중앙 스프레드 | 종목수 |")
          print("|---|---:|---:|")
          for s in d['subs'][:10]:
              print(f"| {s.get('ko') or s['desc']} | {s['med']:+.1f}p | {s['n']} |")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tree-${{ github.run_number }}
          path: data/tree.json

      - name: Commit
        if: github.event.inputs.commit != 'false'
        run: |
          git config user.name  "hegemony-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tree.json
          # 티커맵 캐시는 전체 빌드가 성공한 회차에만 생긴다. 없을 때 그냥
          # git add 하면 pathspec 오류로 스텝이 죽고 — 실측으로 run #22 에서
          # 가격 갱신을 다 해놓고 커밋을 못 했다 — 데이터가 통째로 버려진다.
          [ -f data/sec_tickers.json ] && git add data/sec_tickers.json || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          # 커밋 메시지가 회차의 실제 내용과 어긋나면 이력이 거짓말을 한다.
          # 세 갈래다: 전체 빌드 성공 / 야후로 실적층 일부 / 가격층만.
          MSG=$(python - <<'PY'
          import json
          d = json.load(open('data/tree.json', encoding='utf-8'))
          cov = d.get('coverage')
          if d.get('partial') == 'prices':
              print("가격층만 갱신 (SEC 차단 · 야후 실적층도 실패)")
          elif cov:
              print(f"야후로 실적층 {cov['fresh']}/{cov['total']}종목 갱신 (SEC 차단)")
          else:
              print("update")
          PY
          )
          git commit -m "auto: $MSG $(date +%Y-%m-%d)"
          # 두 빌더가 같은 브랜치에 민다. 동시에 돌면 뒤늦은 쪽이 거부당하는데,
          # 그때 빌드 결과를 통째로 버리면 안 된다(실측: KR #22 가 데이터를
          # 다 만들고도 push 거부로 실패했다). 남의 커밋 위로 rebase 하고
          # 다시 민다. 우리가 건드리는 건 데이터 파일 하나뿐이라 충돌하지 않는다.
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "::notice::push 거부 — 원격 변경을 받아 rebase 후 재시도 ($i/5)"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || {
              echo "::error::rebase 실패 — 수동 확인 필요"; exit 1; }
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 push 실패"; exit 1

      # 부분 갱신으로 넘어갔더라도 원인은 남긴다 — 조용히 성공한 척하지 않는다.
      - name: 전체 빌드가 실패했음을 잡 결과에 반영
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::이 회차는 부분 갱신입니다. 다음 스케줄(백업 슬롯 포함)이 전체 빌드를 다시 시도합니다."
