name: Page tests

# 페이지 결함은 대부분 '실데이터를 넣어봐야' 보인다. 그래서 테스트는 픽스처가
# 아니라 레포에 커밋된 실제 data/*.json 을 그대로 먹여 jsdom 에서 렌더한다.
# 파리티 테스트는 한국판·미국판 판정 로직이 갈라지는 것을 막는다(실제로 났던 사고).

on:
  push:
    paths: &paths
      - 'index.html'
      - 'us.html'
      - 'tests/**'
      - 'docs/gpt-instructions.md'
      - '*.webmanifest'
      - 'refresh_prices.py'
      - 'build_tree_kr.py'
      - 'build_data.py'
      - 'est_trend.py'
      - 'dart.py'
      - 'naver.py'
      - '.github/workflows/*.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: tests
        run: npm test

      # 부분 갱신은 SEC 가 막힌 회차에만 도는 코드라 평소엔 아무도 안 밟는다.
      # 정작 필요한 순간에 처음 실행되는 코드는 믿을 수 없으므로 매번 돌린다.
      - name: 빌더 자가진단 (네트워크 불필요)
        run: |
          python buildlib.py --selftest
          python refresh_prices.py --selftest
          python build_tree_kr.py --selftest
          python est_trend.py --selftest
          python dart.py --selftest
          python naver.py --selftest
          # build_data.py 는 첫 줄부터 네트워크를 타서 자가진단을 못 붙인다.
          # 최소한 문법은 본다 — 이게 없어서 파이썬만 고친 커밋에 CI 가
          # 아예 안 돌던 적이 있다.
          python -m py_compile build_data.py refresh_prices.py build_tree_kr.py est_trend.py dart.py naver.py

      # 데이터 파이프라인은 워크플로의 셸 한 줄이 틀려도 조용히 결과를 버린다.
      # 실제로 그런 일이 두 번 있었다(push 경합, git add pathspec) — 다만 그
      # 둘은 런타임 실패라 문법 검사로는 못 잡는다. 그건 셸 쪽을 방어적으로
      # 쓰는 걸로 막았고, 여기서는 최소한의 바닥만 깐다: YAML 이 깨졌거나
      # 셸 문법이 틀리면 워크플로가 아예 안 돌거나 첫 줄에서 죽는다.
      - name: 워크플로 YAML·셸 문법
        run: |
          # 이 러너에는 파이썬만 깔려 있고 PyYAML 은 없다. 로컬에 마침 있어서
          # 통과하는 걸 보고 올렸다가 CI 에서 ModuleNotFoundError 로 죽었다.
          pip install --quiet pyyaml
          python - <<'PY'
          import yaml, pathlib, sys
          bad = 0
          for f in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  d = yaml.safe_load(f.read_text())
              except Exception as e:
                  print(f'  FAIL {f}: {e}'); bad += 1; continue
              print(f'  ok   {f} YAML')
              # run: 블록을 bash -n 으로 문법 검사할 수 있게 뽑아둔다
              for job in (d.get('jobs') or {}).values():
                  for i, st in enumerate(job.get('steps') or []):
                      if 'run' in st:
                          pathlib.Path(f'/tmp/wf_{f.stem}_{i}.sh').write_text(st['run'])
          sys.exit(bad)
          PY
          for f in /tmp/wf_*.sh; do
            bash -n "$f" || { echo "  FAIL 셸 문법: $f"; exit 1; }
          done
          echo "  ok   모든 run 블록 셸 문법"
