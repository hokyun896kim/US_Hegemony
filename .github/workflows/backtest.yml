# 백테스트 과거 데이터 수집 — 일회성 배치. 스케줄 없이 손으로만 돌린다.
#
# 왜 별도 워크플로인가 — 주간 갱신(update_kr.yml)에 얹으면 매주 몇 시간짜리
# 수집이 따라붙는다. 과거 재무는 한 번 받으면 안 변하므로 따로 둔다.
#
# 중간에 끊겨도 된다. --deadline 으로 스스로 끊고 받은 데까지 커밋하며,
# 다시 돌리면 이미 받은 종목을 건너뛰고 이어받는다.
#
# 한 번에 다 못 받는 게 정상이다. 실측(2026-09-17 프로브 · 005930):
#
#     3년치  67초/종목
#     6년치 172초/종목   ← 2.6배. 연도가 두 배인데 그 이상 든다
#
# 233종목이면 약 670분(11시간)이라 잡 한도 350분으로는 2~3회 나눠 받는다.
# 처음 추정은 약 500분이었다(호출 수가 두 배니 시간도 두 배라고 봤다). 왜 2배가
# 아니라 2.6배인지는 아직 안 재봤다 — 한 종목 한 번의 측정이라 그냥 편차일 수도
# 있다. 배치를 돌리면 로그의 종목당 페이스로 확인된다.
#
# 예산을 늘려 한 번에 끝내려 하면 한도에 먼저 걸려 결과를 통째로 잃는다
# (미국판 8/15 실측: 210분 쓰고 0바이트). 나눠 받는 쪽이 항상 싸다.
name: Backtest Fetch (KR)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '앞에서 N종목만 (0 = 전체)'
        default: '0'
      deadline:
        description: '수집 예산(분). 잡 한도(350)보다 낮게.'
        default: '330'
      years:
        description: '몇 년치 분기를 받을지. 6 이면 과거 T 에서도 8분기가 찬다.'
        default: '6'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 잡 한도는 하드 캡(360분) 바로 아래. 빌더가 --deadline 으로 먼저 끊어
    # 받은 데까지 저장하므로, 여기 걸려 결과를 통째로 잃는 일은 없다.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Logic self-test (네트워크 불필요)
        run: |
          python backtest_fetch.py --selftest
          python dart.py --selftest

      - name: 과거 분기 재무 + 공시 달력 수집
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
        run: |
          python backtest_fetch.py \
            --limit ${{ inputs.limit }} \
            --years ${{ inputs.years }} \
            --deadline ${{ inputs.deadline }}

      - name: Commit
        run: |
          git config user.name  "hegemony-bot"
          git config user.email "bot@users.noreply.github.com"
          # 수집이 실패하면 파일이 없다. 없는 경로를 add 하면 pathspec 오류로
          # 스텝이 죽는다 — 미국판 run #22 와 같은 함정.
          [ -f data/backtest/kr-quarters.json ] && git add data/backtest/kr-quarters.json || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "auto(backtest): 과거 분기 재무 수집 $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "::notice::push 거부 — 원격을 받아 rebase 후 재시도 ($i/5)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              echo "::error::rebase 실패 — 수동 확인 필요"; exit 1; }
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 push 실패"; exit 1
