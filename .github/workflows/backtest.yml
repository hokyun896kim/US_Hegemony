# 백테스트 과거 데이터 수집 — 일회성 배치. 스케줄 없이 손으로만 돌린다.
#
# 왜 별도 워크플로인가 — 주간 갱신(update_kr.yml)에 얹으면 매주 몇 시간짜리
# 수집이 따라붙는다. 과거 재무는 한 번 받으면 안 변하므로 따로 둔다.
#
# 중간에 끊겨도 된다. --deadline 으로 스스로 끊고 받은 데까지 커밋하며,
# 다시 돌리면 이미 받은 종목을 건너뛰고 이어받는다.
#
# 실측 페이스 (2026-09-17 · 6년치):
#
#     프로브 1종목(005930)   172초   ← 한 번 재고 그대로 믿었다
#     본배치 153종목         129초   (329분 / 153)
#     조각   45종목          131초   (98분 / 45)
#
# 한 종목 한 번의 측정은 25% 빗나갔다. 프로브는 '모양이 맞는가' 를 보는 도구지
# 페이스를 재는 도구가 아니다 — 앞으로도 예산은 배치 로그로 잡는다.
#
# 233종목이면 약 500분이라 잡 한도 350분을 한 번 넘는다. 순서대로 이어받으면
# 조각들이 줄을 서지만, offset 으로 나눠 동시에 돌리면 벽시계로 약 100분이면
# 끝난다(실측: 네 갈래로 18:11~00:40 에 233종목 완주).
#
# 예산을 늘려 한 번에 끝내려 하면 한도에 먼저 걸려 결과를 통째로 잃는다
# (미국판 8/15 실측: 210분 쓰고 0바이트). 나눠 받는 쪽이 항상 싸다.
#
# 순서대로 이어받으면 조각들이 줄을 서서 기다린다(11시간). offset·out 으로
# 구간을 나눠 동시에 돌리면 벽시계 시간이 조각 수만큼 줄어든다. DART 호출
# 총량은 그대로다 — 같은 종목을 두 번 받지 않으므로. 조각마다 out 을 다르게
# 줘야 서로를 덮어쓰지 않는다. 다 받은 뒤:
#
#     python backtest_fetch.py --merge data/backtest/kr-quarters-*.json \
#                              --out data/backtest/kr-quarters.json
#
# 취소는 최후의 수단이다. 빌더는 루프가 끝난 뒤에야 파일을 쓰므로, 도중에
# 죽이면 그때까지 받은 것이 통째로 사라진다.
name: Backtest Fetch (KR)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '앞에서 N종목만 (0 = 전체)'
        default: '0'
      deadline:
        description: '수집 예산(분). 잡 한도(350)보다 낮게.'
        default: '330'
      years:
        description: '몇 년치 분기를 받을지. 6 이면 과거 T 에서도 8분기가 찬다.'
        default: '6'
      offset:
        description: '앞 N종목을 건너뛴다. limit 과 같이 쓰면 구간이 된다.'
        default: '0'
      out:
        description: '저장 경로. 병렬로 나눠 받을 때 조각마다 다르게 준다.'
        default: 'data/backtest/kr-quarters.json'
      universe:
        description: '종목 목록 파일. 확대 유니버스를 쓰려면 그 경로를 준다.'
        default: 'data/tree_kr.json'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 잡 한도는 하드 캡(360분) 바로 아래. 빌더가 --deadline 으로 먼저 끊어
    # 받은 데까지 저장하므로, 여기 걸려 결과를 통째로 잃는 일은 없다.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Logic self-test (네트워크 불필요)
        run: |
          python backtest_fetch.py --selftest
          python dart.py --selftest

      - name: 과거 분기 재무 + 공시 달력 수집
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
        run: |
          python backtest_fetch.py \
            --limit ${{ inputs.limit }} \
            --offset ${{ inputs.offset }} \
            --universe '${{ inputs.universe }}' \
            --years ${{ inputs.years }} \
            --out '${{ inputs.out }}' \
            --deadline ${{ inputs.deadline }}

      - name: Commit
        run: |
          git config user.name  "hegemony-bot"
          git config user.email "bot@users.noreply.github.com"
          # 수집이 실패하면 파일이 없다. 없는 경로를 add 하면 pathspec 오류로
          # 스텝이 죽는다 — 미국판 run #22 와 같은 함정.
          [ -f '${{ inputs.out }}' ] && git add '${{ inputs.out }}' || true
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "auto(backtest): 과거 분기 재무 수집 $(date +%Y-%m-%d) ${{ inputs.out }}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "::notice::push 거부 — 원격을 받아 rebase 후 재시도 ($i/5)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              echo "::error::rebase 실패 — 수동 확인 필요"; exit 1; }
            sleep $((i * 3))
          done
          echo "::error::5회 재시도 후에도 push 실패"; exit 1
