# 정적 사이트 — 빌드 단계 없이 레포 루트를 그대로 서빙한다.
# 데이터(data/tree_kr.json)는 GitHub Actions 가 커밋하고, 그 push 가 배포를 부른다.
[build]
  publish = "."
  command = ""

# 한국판이 루트로 올라오기 전 주소. 기존 링크·북마크가 깨지지 않게 넘겨준다.
[[redirects]]
  from = "/kr.html"
  to = "/"
  status = 301

# 데이터는 매주 바뀌므로 캐시에 눌러붙으면 안 된다.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 화면 코드도 캐시에 눌러붙으면 안 된다. 아이폰 홈 화면 웹앱(standalone)은
# 새로고침 버튼이 없어서, 낡은 HTML 이 캐시에 남으면 사용자가 스스로 벗어날
# 방법이 없다. 매번 서버에 확인하게 하되(must-revalidate) 안 바뀌었으면
# 304 로 끝나므로 트래픽 부담은 없다.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 홈 화면 추가(웹앱)가 동작하려면 매니페스트가 올바른 타입으로 나가야 한다.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# 아이콘은 바뀔 일이 드물다.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
